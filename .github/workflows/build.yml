name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (universal)
        run: ./build.sh --universal

      - name: Verify bundle
        run: |
          ls -la "build/Mac Mouse Improver.app/Contents/"
          file "build/Mac Mouse Improver.app/Contents/MacOS/MacMouseImprover"
          codesign --verify --verbose=2 "build/Mac Mouse Improver.app"

      - name: Zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "Mac Mouse Improver.app" "MacMouseImprover.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MacMouseImprover
          path: build/MacMouseImprover.app.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MacMouseImprover.app.zip
          generate_release_notes: true
